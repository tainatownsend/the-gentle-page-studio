name: Remediate npm audit

on:
  pull_request:
    branches:
      - feature/publication-fillable-pdf-download

permissions:
  contents: write

jobs:
  remediate:
    if: github.head_ref == 'chore/npm-audit-remediation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/npm-audit-remediation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit fix --package-lock-only
      - run: npm audit --audit-level=high
      - run: npm run quality
      - name: Commit reviewed lockfile remediation
        run: |
          rm .github/workflows/remediate-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/remediate-audit.yml
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "chore: remediate audited dependencies"
          git push origin HEAD:chore/npm-audit-remediation
