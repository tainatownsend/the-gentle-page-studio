name: MVP consolidation

on:
  push:
    branches: [release/mvp-manual-acceptance]

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/mvp-manual-acceptance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Consolidate validated branches
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin \
            feature/publication-revision-comparison-ui \
            chore/npm-audit-remediation \
            perf/lazy-fillable-pdf-serializer \
            docs/mvp-acceptance-checklist \
            chore/dependabot-npm \
            feature/publication-templates \
            feature/asset-library \
            feature/publication-draft-recovery-v2

          git merge --no-edit origin/feature/publication-revision-comparison-ui
          git merge --no-edit origin/chore/npm-audit-remediation
          git merge --no-edit origin/perf/lazy-fillable-pdf-serializer
          git merge --no-edit origin/docs/mvp-acceptance-checklist
          git merge --no-edit origin/chore/dependabot-npm
          git merge --no-edit origin/feature/publication-templates
          git merge --no-edit origin/feature/asset-library
          git merge --no-edit -X ours origin/feature/publication-draft-recovery-v2

          cat > src/app/routes/PublicationsRoutes.tsx <<'EOF'
          import type { ReactElement } from 'react'
          import {
            Navigate,
            Route,
            Routes,
            useNavigate,
            useParams,
          } from 'react-router-dom'

          import { AssetsPage } from '@/studio/assets'
          import {
            PublicationCreatePage,
            PublicationEditorPage,
            PublicationHistoryPage,
            PublicationPreviewPage,
            PublicationsPage,
            clearPublicationDraftRecovery,
            loadPublicationDraftRecovery,
            savePublicationDraftRecovery,
            usePublicationsWorkspace,
            type PublicationCreateValues,
            type PublicationEditorValues,
            type PublicationsWorkspace,
          } from '@/studio/publications'

          type PublicationRouteWorkspace = Pick<
            PublicationsWorkspace,
            'getPublication' | 'updatePublication'
          >

          type PublicationEditorRouteProps = {
            workspace: PublicationRouteWorkspace
          }

          function PublicationEditorRoute({
            workspace,
          }: PublicationEditorRouteProps): ReactElement {
            const navigate = useNavigate()
            const { publicationId } = useParams()
            const publication = workspace.getPublication(publicationId)

            if (!publication || !publicationId) {
              return <Navigate to="/publications" replace />
            }

            const resolvedPublicationId = publicationId
            const baseUpdatedAt = publication.updatedAt
            const recoveredDraft = loadPublicationDraftRecovery(
              resolvedPublicationId,
              baseUpdatedAt,
            )

            function handleSave(values: PublicationEditorValues) {
              workspace.updatePublication(resolvedPublicationId, values)
              clearPublicationDraftRecovery(resolvedPublicationId)
              navigate('/publications')
            }

            function handleDraftAutosave(values: PublicationEditorValues) {
              savePublicationDraftRecovery(
                resolvedPublicationId,
                baseUpdatedAt,
                values,
              )
            }

            return (
              <PublicationEditorPage
                publication={publication}
                recoveredDraft={recoveredDraft}
                onBack={() => navigate('/publications')}
                onSave={handleSave}
                onDraftAutosave={handleDraftAutosave}
                onDraftDiscard={() =>
                  clearPublicationDraftRecovery(resolvedPublicationId)
                }
              />
            )
          }

          type PublicationPreviewRouteProps = {
            workspace: Pick<PublicationsWorkspace, 'getPublication'>
          }

          function PublicationPreviewRoute({
            workspace,
          }: PublicationPreviewRouteProps): ReactElement {
            const navigate = useNavigate()
            const { publicationId } = useParams()
            const publication = workspace.getPublication(publicationId)

            if (!publication || !publicationId) {
              return <Navigate to="/publications" replace />
            }

            const encodedPublicationId = encodeURIComponent(publicationId)

            return (
              <PublicationPreviewPage
                publication={publication}
                onBack={() => navigate('/publications')}
                onEdit={() =>
                  navigate(`/publications/${encodedPublicationId}/edit`)
                }
                onHistory={() =>
                  navigate(`/publications/${encodedPublicationId}/history`)
                }
              />
            )
          }

          type PublicationHistoryRouteProps = {
            workspace: Pick<
              PublicationsWorkspace,
              | 'getPublication'
              | 'getPublicationRevisions'
              | 'restorePublicationRevision'
            >
          }

          function PublicationHistoryRoute({
            workspace,
          }: PublicationHistoryRouteProps): ReactElement {
            const navigate = useNavigate()
            const { publicationId } = useParams()
            const publication = workspace.getPublication(publicationId)

            if (!publication || !publicationId) {
              return <Navigate to="/publications" replace />
            }

            const encodedPublicationId = encodeURIComponent(publicationId)
            const revisions = workspace.getPublicationRevisions(publicationId)

            function handleRestore(revisionId: string) {
              const restoredDraft = workspace.restorePublicationRevision(revisionId)

              if (!restoredDraft) {
                return
              }

              navigate(
                `/publications/${encodeURIComponent(restoredDraft.id)}/edit`,
              )
            }

            return (
              <PublicationHistoryPage
                publication={publication}
                revisions={revisions}
                onBack={() =>
                  navigate(`/publications/${encodedPublicationId}/preview`)
                }
                onRestore={handleRestore}
              />
            )
          }

          export function PublicationsRoutes(): ReactElement {
            const navigate = useNavigate()
            const workspace = usePublicationsWorkspace()

            function handleCreate(values: PublicationCreateValues) {
              const publication = workspace.createDraft(values)
              navigate(
                `/publications/${encodeURIComponent(publication.id)}/edit`,
              )
            }

            return (
              <Routes>
                <Route path="/" element={<Navigate to="/publications" replace />} />

                <Route
                  path="/publications"
                  element={
                    <PublicationsPage
                      publications={workspace.publications}
                      onCreate={() => navigate('/publications/new')}
                      onAssets={() => navigate('/assets')}
                      onOpen={(id) =>
                        navigate(`/publications/${encodeURIComponent(id)}/edit`)
                      }
                      onPreview={(id) =>
                        navigate(`/publications/${encodeURIComponent(id)}/preview`)
                      }
                      onDuplicate={workspace.duplicatePublication}
                      onDelete={workspace.deletePublication}
                    />
                  }
                />

                <Route
                  path="/assets"
                  element={<AssetsPage onBack={() => navigate('/publications')} />}
                />

                <Route
                  path="/publications/new"
                  element={
                    <PublicationCreatePage
                      onBack={() => navigate('/publications')}
                      onCreate={handleCreate}
                    />
                  }
                />

                <Route
                  path="/publications/:publicationId/edit"
                  element={<PublicationEditorRoute workspace={workspace} />}
                />

                <Route
                  path="/publications/:publicationId/preview"
                  element={<PublicationPreviewRoute workspace={workspace} />}
                />

                <Route
                  path="/publications/:publicationId/history"
                  element={<PublicationHistoryRoute workspace={workspace} />}
                />

                <Route path="*" element={<Navigate to="/publications" replace />} />
              </Routes>
            )
          }
          EOF

          sed -i 's/^          //' src/app/routes/PublicationsRoutes.tsx
          npx prettier --write src/app/routes/PublicationsRoutes.tsx
      - name: Validate consolidated MVP
        run: |
          npm ci
          npm audit --audit-level=high
          npm run quality
      - name: Finalize release-candidate branch
        run: |
          rm .github/workflows/tmp-mvp-consolidation.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: consolidate MVP release candidate"
          fi
          git push origin HEAD:release/mvp-manual-acceptance
