name: Draft recovery implementation

on:
  push:
    branches: [feature/publication-draft-recovery]
  pull_request:
    branches: [feature/publication-revision-comparison-ui]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/publication-draft-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply draft recovery
        run: |
          python <<'PY'
          from pathlib import Path
          persistence = Path('src/studio/publications/persistence/publicationDraftRecovery.ts')
          persistence.write_text("""import type { PublicationContent, PublicationStatus } from '../types'\n\nexport const PUBLICATION_DRAFT_RECOVERY_STORAGE_KEY = 'the-gentle-page-studio.publication-draft-recovery.v1'\n\nexport type PublicationDraftRecoveryValues = { title: string; description?: string; status: PublicationStatus; content: PublicationContent }\ntype PublicationDraftRecoveryEntry = { publicationId: string; baseUpdatedAt: string; savedAt: string; values: PublicationDraftRecoveryValues }\n\nfunction loadEntries(): PublicationDraftRecoveryEntry[] {\n  try { const raw = localStorage.getItem(PUBLICATION_DRAFT_RECOVERY_STORAGE_KEY); if (!raw) return []; const parsed = JSON.parse(raw); return Array.isArray(parsed) ? parsed : [] } catch { return [] }\n}\nfunction saveEntries(entries: PublicationDraftRecoveryEntry[]): void { try { localStorage.setItem(PUBLICATION_DRAFT_RECOVERY_STORAGE_KEY, JSON.stringify(entries)) } catch { /* best effort */ } }\nexport function loadPublicationDraftRecovery(publicationId: string, baseUpdatedAt: string): PublicationDraftRecoveryValues | undefined { const entry = loadEntries().find((candidate) => candidate.publicationId === publicationId); if (!entry || entry.baseUpdatedAt !== baseUpdatedAt) return undefined; return { ...entry.values, content: { blocks: entry.values.content.blocks.map((block) => ({ ...block })) } } }\nexport function savePublicationDraftRecovery(publicationId: string, baseUpdatedAt: string, values: PublicationDraftRecoveryValues): void { const next = { publicationId, baseUpdatedAt, savedAt: new Date().toISOString(), values: { ...values, content: { blocks: values.content.blocks.map((block) => ({ ...block })) } } }; saveEntries([next, ...loadEntries().filter((entry) => entry.publicationId !== publicationId)]) }\nexport function clearPublicationDraftRecovery(publicationId: string): void { saveEntries(loadEntries().filter((entry) => entry.publicationId !== publicationId)) }\n""")
          Path('src/studio/publications/persistence/publicationDraftRecovery.test.ts').write_text("""import { beforeEach, describe, expect, it } from 'vitest'\nimport { clearPublicationDraftRecovery, loadPublicationDraftRecovery, savePublicationDraftRecovery } from './publicationDraftRecovery'\nconst values = { title: 'Recovered journal', description: 'Unsaved work', status: 'draft' as const, content: { blocks: [{ id: 'block-1', type: 'paragraph' as const, text: 'Hello' }] } }\ndescribe('publicationDraftRecovery', () => { beforeEach(() => localStorage.clear()); it('restores only matching publication versions', () => { savePublicationDraftRecovery('pub-1','v1',values); expect(loadPublicationDraftRecovery('pub-1','v1')).toEqual(values); expect(loadPublicationDraftRecovery('pub-1','v2')).toBeUndefined() }); it('clears independently', () => { savePublicationDraftRecovery('pub-1','v1',values); clearPublicationDraftRecovery('pub-1'); expect(loadPublicationDraftRecovery('pub-1','v1')).toBeUndefined() }) })\n""")
          p = Path('src/studio/publications/persistence/index.ts'); t = p.read_text();
          if "publicationDraftRecovery" not in t: t += "\nexport { clearPublicationDraftRecovery, loadPublicationDraftRecovery, PUBLICATION_DRAFT_RECOVERY_STORAGE_KEY, savePublicationDraftRecovery } from './publicationDraftRecovery'\nexport type { PublicationDraftRecoveryValues } from './publicationDraftRecovery'\n"; p.write_text(t)
          route = Path('src/app/routes/PublicationsRoutes.tsx'); t = route.read_text(); t = t.replace("  PublicationCreatePage,\n", "  PublicationCreatePage,\n  clearPublicationDraftRecovery,\n  loadPublicationDraftRecovery,\n").replace("  PublicationsPage,\n", "  PublicationsPage,\n  savePublicationDraftRecovery,\n"); t = t.replace("  const resolvedPublicationId = publicationId\n\n  function handleSave(values: PublicationEditorValues) {\n    workspace.updatePublication(resolvedPublicationId, values)\n    navigate('/publications')\n  }", "  const resolvedPublicationId = publicationId\n  const recoveredDraft = loadPublicationDraftRecovery(publication.id, publication.updatedAt)\n\n  function handleSave(values: PublicationEditorValues) { workspace.updatePublication(resolvedPublicationId, values); clearPublicationDraftRecovery(resolvedPublicationId); navigate('/publications') }\n  function handleDraftAutosave(values: PublicationEditorValues) { savePublicationDraftRecovery(resolvedPublicationId, publication.updatedAt, values) }"); t = t.replace("      publication={publication}\n      onBack={() => navigate('/publications')}\n      onSave={handleSave}\n", "      publication={publication}\n      recoveredDraft={recoveredDraft}\n      onBack={() => navigate('/publications')}\n      onSave={handleSave}\n      onDraftAutosave={handleDraftAutosave}\n      onDraftDiscard={() => clearPublicationDraftRecovery(resolvedPublicationId)}\n"); route.write_text(t)
          editor = Path('src/studio/publications/pages/PublicationEditorPage/PublicationEditorPage.tsx'); t = editor.read_text(); t = t.replace("export type PublicationEditorPageProps = {\n  publication: Publication\n  onBack: () => void\n  onSave: (values: PublicationEditorValues) => void\n}", "export type PublicationEditorPageProps = { publication: Publication; recoveredDraft?: PublicationEditorValues; onBack: () => void; onSave: (values: PublicationEditorValues) => void; onDraftAutosave?: (values: PublicationEditorValues) => void; onDraftDiscard?: () => void }"); t = t.replace("  publication,\n  onBack,\n  onSave,\n}: PublicationEditorPageProps): ReactElement {\n  const [title, setTitle] = useState(publication.title)\n  const [description, setDescription] = useState(publication.description ?? '')\n  const [status, setStatus] = useState<PublicationStatus>(publication.status)\n  const [content, setContent] = useState<PublicationContent>(() =>\n    cloneContent(publication.content),\n  )", "  publication, recoveredDraft, onBack, onSave, onDraftAutosave, onDraftDiscard,\n}: PublicationEditorPageProps): ReactElement {\n  const [title, setTitle] = useState(recoveredDraft?.title ?? publication.title)\n  const [description, setDescription] = useState(recoveredDraft?.description ?? publication.description ?? '')\n  const [status, setStatus] = useState<PublicationStatus>(recoveredDraft?.status ?? publication.status)\n  const [content, setContent] = useState<PublicationContent>(() => cloneContent(recoveredDraft?.content ?? publication.content))"); marker="  function markAsDraftAfterEdit() {"; effect="  useEffect(() => { if (!hasUnsavedChanges || !onDraftAutosave) return; const timeoutId = window.setTimeout(() => onDraftAutosave({ title, description: description || undefined, status, content: cloneContent(content) }), 700); return () => window.clearTimeout(timeoutId) }, [content, description, hasUnsavedChanges, onDraftAutosave, status, title])\n\n"; t=t.replace(marker,effect+marker); t=t.replace("              description={`Status: ${status === 'published' ? 'Published' : 'Draft'}`}\n", "              description={recoveredDraft ? `Status: ${status === 'published' ? 'Published' : 'Draft'} · Recovered unsaved changes` : `Status: ${status === 'published' ? 'Published' : 'Draft'}`}\n",1); t=t.replace("          onDiscard={onBack}\n", "          onDiscard={() => { onDraftDiscard?.(); onBack() }}\n"); editor.write_text(t)
          PY
      - run: npx prettier --write src/app/routes/PublicationsRoutes.tsx src/studio/publications/persistence src/studio/publications/pages/PublicationEditorPage/PublicationEditorPage.tsx
      - run: npm run quality
      - name: Commit implementation
        run: |
          rm .github/workflows/tmp-draft-recovery.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(publications): add autosave draft recovery"
          git push origin HEAD:feature/publication-draft-recovery
