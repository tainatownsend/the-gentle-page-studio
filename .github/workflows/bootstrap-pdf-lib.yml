name: Bootstrap pdf-lib dependency

on:
  push:
    branches: [feature/publication-fillable-pdf-serializer]
    paths:
      - .github/workflows/bootstrap-pdf-lib.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/publication-fillable-pdf-serializer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install pdf-lib@1.17.1 --save-exact
      - run: |
          rm .github/workflows/bootstrap-pdf-lib.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/bootstrap-pdf-lib.yml
          git commit -m "chore(deps): add pdf-lib"
          git push origin HEAD:feature/publication-fillable-pdf-serializer
